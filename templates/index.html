<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동물 사진 분류기</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>동물 사진 분류기</h1>
      <p class="subtitle">이미지를 업로드하면 상위 예측 결과를 보여드립니다.</p>
    </header>

    <section class="uploader">
      <div id="dropzone" class="dropzone">
        <p>여기에 이미지를 드래그 앤 드롭하거나, 아래 버튼으로 선택하세요.</p>
        <input id="fileInput" type="file" accept="image/*" />
        <button id="selectBtn" class="primary">이미지 선택</button>
      </div>
      <div id="preview" class="preview hidden">
        <img id="previewImg" alt="미리보기" />
        <div class="actions">
          <button id="predictBtn" class="primary">분류하기</button>
          <button id="resetBtn" class="secondary">다시 선택</button>
        </div>
      </div>
    </section>

    <section id="results" class="results hidden">
      <h2>예측 결과</h2>
      <div id="resultList"></div>
    </section>

    <footer>
      <a href="/healthz" target="_blank">상태 확인</a>
    </footer>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const selectBtn = document.getElementById('selectBtn');
    const predictBtn = document.getElementById('predictBtn');
    const resetBtn = document.getElementById('resetBtn');
    const dropzone = document.getElementById('dropzone');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const resultsSection = document.getElementById('results');
    const resultList = document.getElementById('resultList');

    let currentFile = null;

    function showPreview(file) {
      const url = URL.createObjectURL(file);
      previewImg.src = url;
      preview.classList.remove('hidden');
      resultsSection.classList.add('hidden');
    }

    function reset() {
      currentFile = null;
      fileInput.value = '';
      previewImg.src = '';
      preview.classList.add('hidden');
      resultsSection.classList.add('hidden');
      resultList.innerHTML = '';
    }

    selectBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      currentFile = file;
      showPreview(file);
    });

    ;['dragenter','dragover'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropzone.classList.add('hover');
      })
    });
    ;['dragleave','drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropzone.classList.remove('hover');
      })
    });
    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('이미지 파일만 업로드할 수 있습니다.');
        return;
      }
      fileInput.files = e.dataTransfer.files;
      currentFile = file;
      showPreview(file);
    });

    predictBtn.addEventListener('click', async () => {
      if (!currentFile) {
        alert('먼저 이미지를 선택하세요.');
        return;
      }
      const formData = new FormData();
      formData.append('file', currentFile);

      resultList.innerHTML = '<div class="loading">분석 중...</div>';
      resultsSection.classList.remove('hidden');

      try {
        const res = await fetch('/predict', { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: '요청 실패' }));
          throw new Error(err.detail || '요청 실패');
        }
        const data = await res.json();
        renderResults(data.predictions || []);
      } catch (err) {
        resultList.innerHTML = `<div class="error">오류: ${err.message}</div>`;
      }
    });

    resetBtn.addEventListener('click', reset);

    function renderResults(predictions) {
      if (!predictions.length) {
        resultList.innerHTML = '<div>결과가 없습니다.</div>';
        return;
      }
      const items = predictions.map(p => {
        const pct = Math.round(p.score * 100);
        return `
          <div class="result-item">
            <div class="label-row">
              <span class="label">${p.label}</span>
              <span class="score">${pct}%</span>
            </div>
            <div class="bar">
              <div class="fill" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
      resultList.innerHTML = items;
    }
  </script>
</body>
</html>
